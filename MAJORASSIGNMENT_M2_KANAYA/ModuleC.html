<!DOCTYPE html>
<head>
  <title>Driver Profile</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffff;
      padding: 20px;
    }

    .container {
      background-color: #ffff;
      width: 400px;
      margin: 0 auto;
      padding: 20px;
      border: 2px solid #ccc;
    }

    h2 {
      text-align: center;
    }

    label {
      font-weight: bold;
      display: block; 
      margin-top: 10px;
    }

    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      margin-bottom: 15px;
      box-sizing: border-box; 
    }

    input[type="radio"] {
      width: auto; 
    }

    button {
      background-color: #007bff;
      color: white;
      width: 100%;
      padding: 10px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .data-row {
      margin-bottom: 15px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
    } 

  </style>
</head>
<body>
  <h2>Driver Profile</h2>
  <div class="container">
    <form action="ModuleCDisplay.html" method="GET">
      
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required placeholder="Naya Priscilla">

      <label for="age">Age:</label>
      <input type="number" id="age" name="age" required placeholder="19" min="1">

      <label for="contactNumber">Contact Number:</label>
      <input type="tel" id="contactNumber" name="contactNumber" placeholder="+62 8XX-XXXX-XXXX" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required placeholder="john@example.com">

      <label for="license">Active License Number:</label>
      <input type="text" id="license" name="license" required placeholder="123456789">

      <label for="activityStatus">Activity Status:</label>
        <select id="activityStatus" name="activityStatus" required>
            <option value="">-- Select Status --</option>
            <option value="Available">Available</option>
            <option value="Off-Duty">Off-Duty (Resting)</option>
        </select>

      <button type="submit">Submit & View Data</button>
    </form>
  </div>
</body>
</html>
