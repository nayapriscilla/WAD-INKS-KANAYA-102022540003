<!DOCTYPE html>
<head>
  <title>Driver Profile</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      background-color: #ffff;
      padding: 20px;
    }

    .container {
      background-color: #ffff;
      width: 400px;
      margin: 0 auto;
      padding: 20px;
      border: 2px solid #ccc;
    }

    h2 {
      text-align: center;
    }

    label {
      font-weight: bold;
      display: block; 
      margin-top: 10px;
    }

    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      margin-bottom: 15px;
      box-sizing: border-box; 
    }

    input[type="radio"] {
      width: auto; 
    }

    button {
      background-color: #007bff;
      color: white;
      width: 100%;
      padding: 10px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .data-row {
      margin-bottom: 15px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
    } 

  </style>
  </style>
</head>

<body>
  <div class="container">
    <h2>Driver Profile</h2>

    <div class="data-row">
      <span class="data-label">Name:</span>
      <span class="data-value">naya</span>
    </div>

    <div class="data-row">
      <span class="data-label">Age:</span>
      <span class="data-value">19</span>
    </div>

    <div class="data-row">
      <span class="data-label">License Number:</span>
      <span class="data-value">123456789</span>
    </div>

    <div class="data-row">
      <span class="data-label">Email:</span>
      <span class="data-value">naya@gmail.com</span>
    </div>

    <div class="data-row">
      <span class="data-label">Activity Status:</span>
      <span class="data-value">Available</span>
    </div>

    <a href="input.html" class="btn" style="margin-top: 20px;">Go Back</a>
  </div>
</body>

</html>
